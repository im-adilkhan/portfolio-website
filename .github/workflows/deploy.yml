name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions tab se manually bhi chala sakte ho

# GITHUB_TOKEN ko Pages pe deploy karne ki permission
permissions:
  contents: read
  pages: write
  id-token: write

# ek waqt pe ek hi deploy; chal rahe deploy ko cancel mat karo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # STATIC_EXPORT next.config.js mein export + basePath on karta hai
          STATIC_EXPORT: "true"
          # /api/contact static host pe nahi hota -> form mailto pe fallback karega
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          # OG/canonical metadata ke liye
          NEXT_PUBLIC_SITE_URL: https://im-adilkhan.github.io/portfolio-website
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
